# Nomtp ubatch ladder — reference knobs (not a live minillm profile).
# Fast path: examples/metal-batch-invariance/run-ubatch-ladder.sh + llama-cli
#   (prompt/notes: benchmarks/metal-batch-invariance/).
# KV locked q8_0/turbo4 (product). Ladder sampling is greedy (temp=0), unlike live yaml.
profile: task066-ladder-nomtp-reference
hf_model: unsloth/gemma-4-26B-A4B-it-GGUF:UD-IQ4_XS
# local: .scratch/gemma-4-26b-a4b/gemma-4-26B-A4B-it-UD-IQ4_XS.gguf
# setup: ./scripts/setup-gemma4-26b-a4b-models.sh
moe_mode: standard
cpu_moe: "0"
gpu_layers: "999"
context_size: "3072"
parallel: "1"
# Default ladder: -b = max(ubatch, 512); vary ubatch per cell.
batch: "512"
ubatch: "8"
cache_ram: "0"
ctx_checkpoints: "32"
flash_attn: on
jinja: "1"
chat_template_kwargs: '{"enable_thinking":false}'
quant_k: q8_0
quant_v: turbo4
temperature: "0"
top_p: "1.0"
top_k: "1"
threads: "4"
threads_batch: "4"
# MTP off (no model_draft / spec_*)
